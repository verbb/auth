name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Lint PHP files
        run: composer lint
